<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Parcel Reconciliation</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/app.css?v=9">
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  .wrap { width: 100%; max-width: 920px; display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
  .brand-big b { display: block; font-size: 20px; } .brand-big span { color: var(--muted); font-size: 13px; }
  form { display: grid; gap: 12px; margin-top: 18px; }
  label { display: grid; gap: 4px; font-size: 13px; font-weight: 500; }
  input[type=text], input[type=password] { width: 100%; padding: 9px 11px; }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; }
  .roles table.data td { vertical-align: middle; }
  .roles .about { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand-big"><b>Parcel Reconciliation Console</b><span>Cadastral ↔ revenue layers · SIH26013</span></div>
    <form id="form" autocomplete="on">
      <label>Username <input type="text" id="username" name="username" autocomplete="username" required autofocus></label>
      <label>Password <input type="password" id="password" name="password" autocomplete="current-password" required></label>
      <div class="err" id="err" role="alert"></div>
      <button class="btn primary" type="submit" id="submit">Sign in</button>
    </form>
    <p class="hint" style="margin-top:14px">Each role sees its own pages. What you can do is checked on the server, not only hidden on screen.</p>
  </div>
  <div class="card roles">
    <h2>Demo accounts</h2>
    <p class="sub">For the hackathon demo only. Disable these in Administration before any real use.</p>
    <table class="data" id="roles"></table>
  </div>
</div>
<script src="assets/common.js?v=9"></script>
<script>
"use strict";
const DEMO = [
  ["officer", "officer1", "officer@123"], ["supervisor", "supervisor", "super@123"],
  ["auditor", "auditor", "audit@123"], ["admin", "admin", "admin@123"],
];

async function goHome(me) {
  const next = new URLSearchParams(location.search).get("next") || "";
  const page = next.split("#")[0];
  location.replace(pageUrl(page && me.pages.includes(page) ? next : me.home));
}

async function boot() {
  // already signed in? go straight to this role's home page
  const s = await (await fetch("/api/session")).json();
  if (s.user) return goHome(s.user);
  const roles = await (await fetch("/api/roles")).json();
  const t = $("roles");
  const hr = el("tr"); for (const h of ["Role", "Username", "Password", ""]) hr.append(el("th", "", h)); t.append(hr);
  for (const [role, user, pw] of DEMO) {
    const tr = el("tr");
    const tdRole = el("td"); tdRole.append(el("span", `role-chip role-${role}`, roles[role].label), el("div", "about", roles[role].about));
    const use = el("button", "btn", "Use");
    use.addEventListener("click", () => { $("username").value = user; $("password").value = pw; $("password").focus(); });
    const tdUse = el("td"); tdUse.append(use);
    tr.append(tdRole, el("td", "mono", user), el("td", "mono", pw), tdUse);
    t.append(tr);
  }
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("err").textContent = ""; $("submit").disabled = true;
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("username").value.trim(), password: $("password").value }) });
    const body = await r.json();
    if (!r.ok) throw new Error(body.detail || "Sign-in failed.");
    goHome(body);
  } catch (err) { $("err").textContent = err.message; $("submit").disabled = false; }
});
boot();
</script>
</body>
</html>
